<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Ticketies</title>
<link rel="icon" href="assets/polaroid-3.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Cinzel:wght@700&family=Cormorant+Garamond:wght@700&family=Cormorant+SC:wght@700&family=Courier+Prime:wght@400;700&family=Grenze+Gotisch:wght@700&family=Josefin+Sans:wght@700&family=Montserrat:wght@700&family=Noto+Serif+JP:wght@700&family=Oswald:wght@400;700&family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
  /* earthy palette */
  :root{
    --bg:#F8F6EE;
    --panel:#D9C9B2;
    --panel-2:#6B7F5B;
    --gold:#C96F4F;
    --gold-deep:#2E3A2F;
    --text:#2E3A2F;
    --muted:#6B7F5B;
  }
  body{background:var(--bg);color:var(--text);}
  .slots-pill{color:var(--gold-deep);}
  .topbar .brand{color:#fff;} /* readable on the dark top bar */
  .btn-print{background:#2E3A2F;color:#F8F6EE;}
  .btn-home{background:#D9C9B2;color:#2E3A2F;}
  .receipt-email input{border-color:#D9C9B2;background:#fff;}
  .receipt-email button{background:#C96F4F;color:#F8F6EE;}

  @media print{
    body{background:#fff;padding:0;}
    .topbar, .ticket-actions, .site-footer, .eticket-count, .ticket-summary{display:none !important;}
    .eticket-scroll{overflow:visible;}
    .eticket{min-width:0;width:100%;}
    .eticket-pair{break-inside:avoid;}
  }
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="brand" style="text-decoration:none;">← Back</a>
</header>

<main id="ticketRoot">
  <div class="ticket-summary receipt" id="ticketSummary"></div>
  <div id="ticketList"></div>

  <div class="ticket-actions">
    <div class="ticket-foot">
      <button class="btn-print" id="printTicket">Print tickets</button>
      <a class="btn-home" href="index.html">Back home</a>
    </div>
    <div class="receipt-email">
      <input type="email" id="receiptEmail" placeholder="Send the e-ticket to an email">
      <button id="sendReceiptBtn" type="button">Send ticket</button>
      <p class="status" id="sendStatus"></p>
    </div>
  </div>
</main>

<footer class="site-footer">© Rockvengers (30120112). All rights reserved.</footer>

<script src="app.js"></script>
</body>
</html>
